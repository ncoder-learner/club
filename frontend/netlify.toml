[build]
  command = "npm run build"
  publish = "dist"

# Proxies API calls through Netlify's own domain so the browser only ever talks
# to club-frontend.netlify.app — no cross-origin request to muffin-worker.workers.dev,
# and nothing for a restrictive network (e.g. a school firewall blocking *.workers.dev)
# to block by hostname.
[[redirects]]
  from = "/api/*"
  to = "https://muffin-worker.nealsinghal10.workers.dev/:splat"
  status = 200
  force = true
